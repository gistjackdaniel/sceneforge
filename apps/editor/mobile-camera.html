<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SceneForge phone camera</title>
    <style>
      :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #101713; color: #edf4ee; }
      body { margin: 0; }
      main { min-height: 100dvh; display: grid; align-items: end; }
      video { position: fixed; inset: 0; width: 100%; height: 100%; background: #101713; object-fit: contain; }
      section { position: relative; box-sizing: border-box; width: min(100%, 32rem); margin: 0 auto; padding: 1.25rem 1.25rem max(1.25rem, env(safe-area-inset-bottom)); background: #17231eea; border-top: 1px solid #426352; border-radius: 16px 16px 0 0; }
      h1 { font-size: 1.25rem; margin: 0; }
      p { min-height: 2.8em; line-height: 1.4; color: #c3d3c9; }
      button, #camera-native { width: 100%; min-height: 48px; border: 0; border-radius: 8px; font: inherit; font-weight: 650; color: #102017; background: #a0efbf; }
      button:disabled { opacity: .55; }
      #camera-native { display: grid; place-items: center; text-decoration: none; }
      #camera-copy { margin-top: 8px; border: 1px solid #426352; background: transparent; color: #edf4ee; }
      details { margin-top: 1rem; color: #c3d3c9; }
      details[open] summary { margin-bottom: .75rem; }
      #marker-width-label:not([hidden]) { display: grid; grid-template-columns: 1fr minmax(5rem, 7rem); align-items: center; gap: 1rem; margin-bottom: .8rem; }
      input { box-sizing: border-box; width: 100%; min-height: 44px; padding: .5rem; border-radius: 6px; border: 1px solid #426352; background: #101713; color: inherit; font: inherit; }
    </style>
  </head>
  <body>
    <main id="camera-overlay">
      <video id="camera-preview" hidden muted playsinline aria-label="Rear camera preview"></video>
      <section>
        <h1>SceneForge phone camera</h1>
        <p id="camera-status" role="status">Connecting to the editor…</p>
        <label id="marker-width-label" hidden>Marker width (cm)<input id="marker-width" type="number" inputmode="decimal" min="0.1" step="any" required /></label>
        <button id="camera-action" hidden disabled>Start AR</button>
        <details id="camera-native-options" hidden>
          <summary>Use installed iPhone app</summary>
          <a id="camera-native">Open SceneForge Camera</a>
          <button id="camera-copy">Copy pairing link</button>
        </details>
      </section>
    </main>
    <script type="module" src="/src/mobile-camera/main.ts"></script>
  </body>
</html>
